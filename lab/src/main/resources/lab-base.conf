include classpath("features/ollama-model-defaults.conf")
include classpath("features/ollama-reply.conf")
include classpath("features/ollama-profile-rewrite.conf")
include classpath("features/ollama-dossier.conf")
include classpath("features/ollama-topic.conf")
include classpath("features/ollama-intent.conf")
include classpath("features/ollama-register.conf")

nyetbot {
  llm {
    enabled      = true
    bot-name     = "NYETBOT"
    bot-alias    = "@nyetterbot"

    message-every = 150

    chat-buffer-size     = 200
    reply-context-window = 20
    recent-user-messages = 50
  }

  reply-length {
    min-chars   = 150
    mean-factor = 1.5
    spread      = 0.3
    max-chars   = 600
  }

  ollama {
    domain = "localhost"
    domain = ${?OLLAMA_DOMAIN}
    port   = 11434

    request-timeout-minutes = 25
    idle-timeout-minutes    = 25

    context {
      chat-log     { enabled = true }
      reply-target { enabled = true }
      user-trigger { enabled = true }
      date         { enabled = true }
    }
  }
}
