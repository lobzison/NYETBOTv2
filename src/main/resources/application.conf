include "features/ollama-model-defaults.conf"
include "features/ollama-reply.conf"
include "features/ollama-summarize-thread.conf"
include "features/ollama-classify-intent.conf"
include "features/ollama-summarize-user.conf"
include "features/ollama-classify-register.conf"

nyetbot {
  bot-token     = ${NYETBOT_KEY}
  database-url  = ${DATABASE_URL}

  llm {
    bot-name     = "NYETBOT"
    bot-alias    = "@nyetterbot"

    message-every = 150
    message-every = ${?LLM_MESSAGE_EVERY}

    chat-buffer-size     = 200   # rolling chat buffer cap
    reply-context-window = 20    # recent chat lines fed into the reply prompt
    recent-user-messages = 50    # per-user window summarised on each reply
  }

  profile-service {
    topic-context-window = 10
    min-chars             = 150
    mean-factor           = 1.5
    spread                = 0.3
    max-chars             = 600
  }

  ollama {
    domain = ${OLLAMA_DOMAIN}
    port   = 11434

    request-timeout-minutes = 25
    idle-timeout-minutes    = 25
  }
}
