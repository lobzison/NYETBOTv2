include "features/ollama-model-defaults.conf"
include "features/ollama-reply.conf"
include "features/ollama-profile-rewrite.conf"
include "features/ollama-dossier.conf"
include "features/ollama-topic.conf"
include "features/ollama-intent.conf"
include "features/ollama-register.conf"

nyetbot {
  bot-token     = ${NYETBOT_KEY}
  database-url  = ${DATABASE_URL}

  llm {
    enabled      = true
    bot-name     = "NYETBOT"
    bot-alias    = "@nyetterbot"

    message-every = 150
    message-every = ${?LLM_MESSAGE_EVERY}

    chat-buffer-size     = 200
    reply-context-window = 20
    recent-user-messages = 50
  }

  reply-length {
    min-chars   = 150
    mean-factor = 1.5
    spread      = 0.3
    max-chars   = 600
  }

  ollama {
    domain = ${OLLAMA_DOMAIN}
    port   = 11434

    request-timeout-minutes = 25
    idle-timeout-minutes    = 25

    context {
      chat-log     { enabled = true }
      reply-target { enabled = true }
      user-trigger { enabled = true }
      date         { enabled = true }
    }
  }
}
